version: 4
distro_name: intelligent-assistant-ogx
apis:
  - responses
  - inference
  - tool_runtime
  - vector_io
  - files
  - file_processors
container_image:
external_providers_dir: '/app-root/providers.d' #built into lcore image
providers:
  responses:
    - config:
        persistence:
          responses:
            table_name: responses
            backend: sql_default
      provider_id: meta-reference
      provider_type: inline::builtin
  files:
    - provider_id: localfs
      provider_type: inline::localfs
      config:
        storage_dir: /tmp/llama-stack-files
        metadata_store:
          table_name: files_metadata
          backend: sql_default
  file_processors:
    - provider_id: pypdf
      provider_type: inline::pypdf
      config:
        default_chunk_size_tokens: 800
        default_chunk_overlap_tokens: 400
storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: /tmp/kvstore.db
    sql_default:
      type: sql_sqlite
      db_path: /tmp/sql_store.db
  stores:
    metadata:
      namespace: registry
      backend: kv_default
    inference:
      table_name: inference_store
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
    conversations:
      table_name: openai_conversations
      backend: sql_default
server:
  auth:
  host:
  port: 8321
  quota:
  tls_cafile:
  tls_certfile:
  tls_keyfile:
