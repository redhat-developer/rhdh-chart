{{- $ia := include "rhdh.intelligentAssistant" . | fromYaml -}}
{{- if include "rhdh.intelligentAssistant.okp.active" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-okp-default-deny
  labels:
    {{- include "rhdh.intelligentAssistant.okp.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.intelligentAssistant.okp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress

{{- $usesHttpIngress := and (not .Values.openshift.route.enabled) (not $ia.okp.ingress.tls.enabled) -}}
{{- $usesInternalService := and .Values.openshift.route.enabled (not .Values.openshift.clusterRouterBase) -}}
{{- if or $usesHttpIngress $usesInternalService }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-okp-allow-backstage-egress
  labels:
    {{- include "rhdh.intelligentAssistant.okp.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: {{ ternary 80 8080 $usesHttpIngress }}
          protocol: TCP
{{- end }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-okp-allow-backstage-ingress
  labels:
    {{- include "rhdh.intelligentAssistant.okp.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.intelligentAssistant.okp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rhdh.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-okp-allow-router-ingress
  labels:
    {{- include "rhdh.intelligentAssistant.okp.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.intelligentAssistant.okp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- if .Values.openshift.route.enabled }}
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
            {{- else }}
            {}
            {{- end }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
