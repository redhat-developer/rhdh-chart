{{- $ia := include "rhdh.intelligentAssistant" . | fromYaml -}}
{{- if include "rhdh.intelligentAssistant.okp.active" . }}
{{- if and (not .Values.openshift.route.enabled) $ia.okp.ingress.enabled $ia.okp.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rhdh.intelligentAssistant.okp.fullname" . }}
  labels:
    {{- include "rhdh.intelligentAssistant.okp.labels" . | nindent 4 }}
  {{- with $ia.okp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ia.okp.ingress.className }}
  ingressClassName: {{ $ia.okp.ingress.className | quote }}
  {{- end }}
  {{- if $ia.okp.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $ia.okp.ingress.host | quote }}
      {{- if $ia.okp.ingress.tls.secretName }}
      secretName: {{ $ia.okp.ingress.tls.secretName | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $ia.okp.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rhdh.intelligentAssistant.okp.fullname" . }}
                port:
                  number: 8080
{{- end }}
{{- end }}
