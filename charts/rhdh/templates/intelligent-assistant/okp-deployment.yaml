{{- $ia := include "rhdh.intelligentAssistant" . | fromYaml -}}
{{- if include "rhdh.intelligentAssistant.okp.active" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rhdh.intelligentAssistant.okp.fullname" . }}
  labels:
    {{- include "rhdh.intelligentAssistant.okp.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $ia.okp.replicaCount }}
  selector:
    matchLabels:
      {{- include "rhdh.intelligentAssistant.okp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rhdh.intelligentAssistant.okp.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "rhdh.intelligentAssistant.okp.imagePullSecrets" . | nindent 6 }}
      {{- with $ia.okp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ia.okp.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ia.okp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ia.okp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: okp
        image: {{ include "rhdh.image.render" (dict "image" $ia.okp.image "global" .Values.global) | quote }}
        imagePullPolicy: {{ $ia.okp.image.pullPolicy | default "IfNotPresent" | quote }}
        {{- with $ia.okp.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command: ["/bin/bash", "-c"]
        args:
          - |
            /opt/solr/bin/solr start --user-managed --force -m {{ $ia.okp.solr.memory }}
            rm -f /etc/httpd/conf.d/ssl.conf
            exec httpd -D FOREGROUND
        env:
        - name: SOLR_HOST_BIND
          value: {{ $ia.okp.solr.hostBind | quote }}
        - name: MIMIR_HTTPD_SERVER_NAME
          value: {{ $ia.okp.httpd.serverName | quote }}
        - name: COMPRESSED
          value: {{ $ia.okp.httpd.compressed | quote }}
        - name: ENCRYPT
          value: {{ $ia.okp.httpd.encrypt | quote }}
        ports:
        - containerPort: 8080
          name: httpd
          protocol: TCP
        - containerPort: 8983
          name: solr
          protocol: TCP
        {{- with $ia.okp.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /
            port: httpd
          initialDelaySeconds: {{ $ia.okp.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ $ia.okp.readinessProbe.periodSeconds }}
        livenessProbe:
          tcpSocket:
            port: solr
          initialDelaySeconds: {{ $ia.okp.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ $ia.okp.livenessProbe.periodSeconds }}
{{- end }}
