apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-default-deny
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-allow-dns-egress
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-allow-https-egress
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-allow-psql-egress
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - {{- if .Values.postgresql.enabled }}
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: primary
        {{- if eq (default "standalone" .Values.postgresql.architecture) "replication" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: read
        {{- end }}
      {{- end }}
      ports:
        - port: {{ if .Values.postgresql.enabled }}5432{{ else }}{{ .Values.externalDatabase.port | default 5432 }}{{ end }}
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-allow-metrics-ingress
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gmp-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9464
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-allow-router-ingress
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- if .Values.openshift.route.enabled }}
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
            {{- else }}
            {}
            {{- end }}
      ports:
        - port: 7007
          protocol: TCP

{{- if .Values.test.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-allow-test-connection
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.selectorLabels" . | nindent 6 }}
      rhdh.redhat.com/test-connection: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "rhdh.selectorLabels" . | nindent 14 }}
      ports:
        - port: 7007
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhdh.fullname" . }}-allow-test-connection-ingress
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "rhdh.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rhdh.selectorLabels" . | nindent 14 }}
              rhdh.redhat.com/test-connection: "true"
      ports:
        - port: 7007
          protocol: TCP
{{- end }}
{{- /*
The following db-* policies are only created when the built-in PostgreSQL is enabled.
When using an external database (postgresql.enabled=false), only the backend NPs above
are created, and allow-psql-egress has no 'to' selector (broad egress on the configured port).

These replace the bitnami subchart's own NPs (disabled via
postgresql.primary.networkPolicy.enabled=false and
postgresql.readReplicas.networkPolicy.enabled=false in values.yaml)
so we can enforce tighter rules.
*/ -}}
{{- if .Values.postgresql.enabled }}
{{- $isReplication := eq (default "standalone" .Values.postgresql.architecture) "replication" }}

