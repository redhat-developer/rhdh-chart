# CI: skip dynamic plugin downloads and catalog index extraction to speed up tests.
# The chart features under test (deployment, config, probes, etc.) don't depend on actual plugins.
dynamicPlugins:
  includes: []
extraAppConfig:
  - configMapRef: "my-app-config"
    filename: "app-config-custom.yaml"
intelligentAssistant:
  plugins: []
  existingSecret: "test-lightspeed-secret"
  okp:
    route:
      enabled: false
    ingress:
      enabled: false
  config:
    stack:
      existingConfigMap:
        name: "test-lightspeed-stack"
    profile:
      existingConfigMap:
        name: "test-lightspeed-profile"
  core:
    extraEnv:
      - name: SERVICE_HOST
        value: "0.0.0.0"
orchestrator:
  enabled: true
  plugins: []

# Exercise extraDeploy with both the string form (Helm template expressions) and the object form.
extraDeploy:
  # String form: supports chart helpers like rhdh.fullname and rhdh.selectorLabels.
  - |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: {{ include "rhdh.fullname" . }}-ci-allow-http-egress
      labels:
        {{- include "rhdh.labels" . | nindent 8 }}
    spec:
      podSelector:
        matchLabels:
          {{- include "rhdh.selectorLabels" . | nindent 10 }}
      policyTypes:
        - Egress
      egress:
        - ports:
            - port: 80
              protocol: TCP
  # Object form: template expressions in individual values, but no multi-line includes.
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: '{{ include "rhdh.fullname" . }}-ci-extra-config'
    data:
      ci-marker: "deployed-by-extraDeploy"
