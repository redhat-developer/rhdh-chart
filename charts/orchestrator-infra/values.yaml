# -- OLM API version to use for operator installation (`v0`, `v1`, or `auto`)
# Use `v0` on clusters without OLM v1, or until the v1 path is fully validated end-to-end.
olmVersion: v0
olm:
  catalog:
    # -- ClusterCatalog selector for OLM v1 ClusterExtension resources
    selector:
      matchLabels:
        olm.operatorframework.io/metadata.name: openshift-redhat-operators

serverlessLogicOperator:
  # -- whether the operator should be deployed by the chart
  enabled: true
  subscription:
    # -- namespace where the operator should be deployed
    namespace: openshift-serverless-logic
    spec:
      # -- channel of an operator package to subscribe to
      channel: stable
      # --  whether the update should be installed automatically
      installPlanApproval: Manual
      # -- name of the operator package
      name: logic-operator
      # --  name of the catalog source
      source: redhat-operators
      sourceNamespace: openshift-marketplace
      # -- The initial version of the operator, must match CRDs installed by the chart
      startingCSV: logic-operator.v1.38.0
  clusterExtension:
    serviceAccount:
      # -- service account used by OLM v1 to install the operator
      name: serverless-logic-operator-installer

serverlessOperator:
  # -- whether the operator should be deployed by the chart
  enabled: true
  subscription:
    # -- namespace where the operator should be deployed
    namespace: openshift-serverless
    spec:
      # -- channel of an operator package to subscribe to
      channel: stable
      # -- whether the update should be installed automatically
      installPlanApproval: Manual
      # -- name of the operator package
      name: serverless-operator
      # -- name of the catalog source
      source: redhat-operators
      sourceNamespace: openshift-marketplace
  clusterExtension:
    serviceAccount:
      # -- service account used by OLM v1 to install the operator
      name: serverless-operator-installer

tests:
  # -- Whether to create the test pod used for testing the Release using `helm test`.
  enabled: true
  # -- Test pod image
  image: bitnami/kubectl:latest
