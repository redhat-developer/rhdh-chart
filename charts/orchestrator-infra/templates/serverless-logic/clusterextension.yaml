{{- $packageName := .Values.serverlessLogicOperator.subscription.spec.name -}}
{{- $namespace := .Values.serverlessLogicOperator.subscription.namespace -}}
{{- $serviceAccountName := .Values.serverlessLogicOperator.clusterExtension.serviceAccount.name -}}
{{- if and (eq (include "olm-version" .) "v1") .Values.serverlessLogicOperator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  namespace: {{ $namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $packageName }}-installer-binding
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountName }}
    namespace: {{ $namespace }}
---
apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  name: {{ $packageName }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  install:
    preflight:
      crdUpgradeSafety:
        enforcement: None
  namespace: {{ $namespace }}
  serviceAccount:
    name: {{ $serviceAccountName }}
  source:
    sourceType: Catalog
    catalog:
      packageName: {{ $packageName }}
      channels:
        - {{ .Values.serverlessLogicOperator.subscription.spec.channel }}
      version: {{ include "csv-version" (list .Values.serverlessLogicOperator.subscription.spec.startingCSV $packageName) | quote }}
      selector:
        {{- toYaml .Values.olm.catalog.selector | nindent 8 }}
      upgradeConstraintPolicy: CatalogProvided
{{- end }}
