{{- $packageName := .Values.serverlessOperator.subscription.spec.name -}}
{{- $subscriptionNamespace := .Values.serverlessOperator.subscription.namespace -}}
{{- if and (eq (include "olm-version" .) "v0") .Values.serverlessOperator.enabled }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ $packageName }}
  namespace: {{ $subscriptionNamespace }}
spec:
  {{- toYaml .Values.serverlessOperator.subscription.spec | nindent 2 }}
{{- end }}
