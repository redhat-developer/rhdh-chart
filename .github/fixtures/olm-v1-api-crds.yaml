apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    olm.operatorframework.io/generator: standard
  name: clusterextensions.olm.operatorframework.io
spec:
  group: olm.operatorframework.io
  names:
    kind: ClusterExtension
    listKind: ClusterExtensionList
    plural: clusterextensions
    singular: clusterextension
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.install.bundle.name
      name: Installed Bundle
      type: string
    - jsonPath: .status.install.bundle.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=='Installed')].status
      name: Installed
      type: string
    - jsonPath: .status.conditions[?(@.type=='Progressing')].status
      name: Progressing
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ClusterExtension is the Schema for the clusterextensions API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: spec is an optional field that defines the desired state
              of the ClusterExtension.
            properties:
              install:
                description: 'install is optional and configures installation options
                  for the ClusterExtension,

                  such as the pre-flight check configuration.'
                properties:
                  preflight:
                    description: 'preflight is optional and configures the checks
                      that run before installation or upgrade

                      of the content for the package specified in the packageName
                      field.


                      When specified, it replaces the default preflight configuration
                      for install/upgrade actions.

                      When not specified, the default configuration is used.'
                    properties:
                      crdUpgradeSafety:
                        description: 'crdUpgradeSafety configures the CRD Upgrade
                          Safety pre-flight checks that run

                          before upgrades of installed content.


                          The CRD Upgrade Safety pre-flight check safeguards from
                          unintended consequences of upgrading a CRD,

                          such as data loss.'
                        properties:
                          enforcement:
                            description: 'enforcement is required and configures the
                              state of the CRD Upgrade Safety pre-flight check.


                              Allowed values are "None" or "Strict". The default value
                              is "Strict".


                              When set to "None", the CRD Upgrade Safety pre-flight
                              check is skipped during an upgrade operation.

                              Use this option with caution as unintended consequences
                              such as data loss can occur.


                              When set to "Strict", the CRD Upgrade Safety pre-flight
                              check runs during an upgrade operation.'
                            enum:
                            - None
                            - Strict
                            type: string
                        required:
                        - enforcement
                        type: object
                    required:
                    - crdUpgradeSafety
                    type: object
                    x-kubernetes-validations:
                    - message: at least one of [crdUpgradeSafety] are required when
                        preflight is specified
                      rule: has(self.crdUpgradeSafety)
                type: object
                x-kubernetes-validations:
                - message: at least one of [preflight] are required when install is
                    specified
                  rule: has(self.preflight)
              namespace:
                description: 'namespace specifies a Kubernetes namespace.

                  It designates the default namespace where namespace-scoped resources
                  for the extension are applied to the cluster.

                  Some extensions may contain namespace-scoped resources to be applied
                  in other namespaces.

                  This namespace must exist.


                  The namespace field is required, immutable, and follows the DNS
                  label standard as defined in [RFC 1123].

                  It must contain only lowercase alphanumeric characters or hyphens
                  (-), start and end with an alphanumeric character,

                  and be no longer than 63 characters.


                  [RFC 1123]: https://tools.ietf.org/html/rfc1123'
                maxLength: 63
                type: string
                x-kubernetes-validations:
                - message: namespace is immutable
                  rule: self == oldSelf
                - message: namespace must be a valid DNS1123 label
                  rule: self.matches("^[a-z0-9]([-a-z0-9]*[a-z0-9])?$")
              serviceAccount:
                description: 'serviceAccount is a deprecated field and is completely
                  ignored.

                  OLMv1 is a single-tenant system where users with ClusterExtension
                  write access are

                  effectively delegated cluster-admin trust. The operator-controller
                  runs with

                  cluster-admin privileges and uses its own service account for all
                  cluster interactions.


                  Deprecated: serviceAccount is no longer used and will be removed
                  in a future release.'
                minProperties: 1
                properties:
                  name:
                    description: "name is a deprecated field and is completely ignored.\n\
                      \nDeprecated: name is no longer used and will be removed in\
                      \ a future release.\n\nThe name field follows the DNS subdomain\
                      \ standard as defined in [RFC 1123].\nIt must contain only lowercase\
                      \ alphanumeric characters, hyphens (-) or periods (.),\nstart\
                      \ and end with an alphanumeric character, and be no longer than\
                      \ 253 characters.\n\nSome examples of valid values are:\n  -\
                      \ some-serviceaccount\n  - 123-serviceaccount\n  - 1-serviceaccount-2\n\
                      \  - someserviceaccount\n  - some.serviceaccount\n\nSome examples\
                      \ of invalid values are:\n  - -some-serviceaccount\n  - some-serviceaccount-\n\
                      \n[RFC 1123]: https://tools.ietf.org/html/rfc1123"
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: name is immutable once set but may be cleared
                      rule: self == oldSelf
                    - message: name must be a valid DNS1123 subdomain. It must contain
                        only lowercase alphanumeric characters, hyphens (-) or periods
                        (.), start and end with an alphanumeric character, and be
                        no longer than 253 characters
                      rule: self.matches("^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$")
                type: object
              source:
                description: "source is required and selects the installation source\
                  \ of content for this ClusterExtension.\nSet the sourceType field\
                  \ to perform the selection.\n\nCatalog is currently the only implemented\
