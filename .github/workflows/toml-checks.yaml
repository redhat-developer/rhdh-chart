name: PR TOML Validator

on:
  push:
    paths:
      - '**.toml'
      - '.github/workflows/toml-checks.yaml'
  pull_request:
    paths:
      - '**.toml'
      - '.github/workflows/toml-checks.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: tombi-toml/setup-tombi@743a0cd1956ab835b602c96078070f47192ff459 # v1.2.8
        with:
          version: 'v0.9.9'
          checksum: 'b50dbc90ec27591dbaf564b628bd3b3e4ead371a60931bc8ea5f34d7cd1d3607'
      - name: Validate TOML files
        run: tombi lint
